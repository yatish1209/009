<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>001 · Landscape Design MCQs</title>
<style>
:root{--bg:#f6f7f4;--card:#fff;--ink:#1d2a24;--mut:#5d6b64;--line:#d5dbd6;--ac:#2f6b4f;--ok:#e2f3e8;--okb:#2e8b57;--bad:#fbe6e4;--badb:#c0453a}
[data-t=dark]{--bg:#121816;--card:#1a221f;--ink:#e6ede9;--mut:#9aa9a1;--line:#2c3934;--ac:#6fc59a;--ok:#173325;--okb:#4fbf83;--bad:#3a1d1a;--badb:#e8766b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font:700 1.3rem Georgia,serif;margin:0}
button,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
button{cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.stat{display:flex;justify-content:space-between;color:var(--mut);font-size:.92rem}
.pg{height:6px;background:var(--line);border-radius:4px;margin:6px 0 14px;overflow:hidden}.pg i{display:block;height:100%;background:var(--ac)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.tp{color:var(--ac);font-size:.85rem;margin-bottom:6px}.q{font:600 1.1rem/1.45 Georgia,serif;margin:0 0 14px}
.o{display:block;width:100%;text-align:left;margin:8px 0;padding:12px}
.o.ok{background:var(--ok);border-color:var(--okb)}.o.no{background:var(--bad);border-color:var(--badb)}
.ex{margin-top:12px;padding:12px;border-left:4px solid var(--ac);background:var(--bg);border-radius:6px}
.nav{display:flex;justify-content:space-between;margin-top:14px}.em{text-align:center;color:var(--mut);padding:30px}
</style></head><body><main>
<header><h1>001 · Landscape Design MCQs</h1><button id="th" aria-label="Toggle light or dark mode">Dark</button></header>
<div class="bar"><select id="tp" aria-label="Topic"></select><select id="fl" aria-label="Filter"><option value="all">All questions</option><option value="un">Unanswered</option><option value="ok">Correct</option><option value="no">Wrong</option></select><button id="sh">Shuffle</button><button id="rs">Reset</button></div>
<div class="stat"><span id="pr"></span><span id="sc"></span></div><div class="pg"><i id="pb"></i></div>
<div id="app"></div><div class="nav"><button id="pv">Previous</button><button id="nx">Next</button></div>
</main><script>
const T={H:"History of landscape styles",P:"Landscape design principles and site planning",E:"Elements, materials, plants and environment"};
// [topic, question, [correct, d1, d2, d3], explanation]  (options are shuffled on screen)
const Q=[
["H","Which pairing about the tomb's position in a charbagh is correct?",["Humayun's Tomb stands at the centre; the Taj Mahal stands at the riverside end","Both tombs stand at the centre","Humayun's Tomb stands at the end; the Taj Mahal stands at the centre","Both tombs stand at the river end"],"Humayun's Tomb (1565-72) is central in its charbagh; the Taj Mahal sits at the northern end on the Yamuna, with Mehtab Bagh opposite."],
["H","Nishat Bagh in Srinagar (1633) was built by:",["Asaf Khan","Jahangir","Ali Mardan Khan","Fidai Khan"],"Asaf Khan built Nishat Bagh with 12 terraces. Jahangir built Shalimar Bagh; Ali Mardan Khan built Chashme Shahi."],
["H","Pinjore Garden in Haryana is credited to:",["Fidai Khan","Asaf Khan","Mirak Mirza Ghiyas","Ali Mardan Khan"],"Fidai Khan, foster brother of Aurangzeb, built it; Patiala rulers later restored it."],
["H","The ha-ha was popularised in English gardens such as Stowe by:",["Charles Bridgeman","William Kent","Capability Brown","Humphry Repton"],"Bridgeman introduced the sunken fence; Kent later 'leaped the fence' toward fully naturalistic design."],
["H","The term 'Gardenesque' is associated with:",["J. C. Loudon","William Robinson","Uvedale Price","Humphry Repton"],"Loudon's Gardenesque displays each plant as an individual specimen; Robinson championed the Wild Garden."],
["H","Ryoan-ji in Kyoto is a classic example of which Japanese garden type?",["Karesansui","Tsukiyama","Kaiyu-shiki (stroll)","Chaniwa"],"Ryoan-ji is a dry landscape (karesansui) of raked gravel and 15 rocks."],
["H","Yuan Ye, the classic Chinese treatise on gardens, was written by:",["Ji Cheng, 1631","Tachibana no Toshitsuna, 11th c.","Ji Cheng, 1509","Wang Wei, Tang period"],"Ji Cheng wrote Yuan Ye in 1631; Sakuteiki is the Japanese Heian manual."],
["H","Villa Lante at Bagnaia, with its central water chain, was designed by:",["Vignola","Pirro Ligorio","Michelozzo","Bramante"],"Vignola designed Villa Lante; Ligorio designed Villa d'Este."],
["H","Vaux-le-Vicomte was created by Le Notre for:",["Nicolas Fouquet","Louis XIV","Prince de Conde","Jean-Baptiste Colbert"],"Fouquet's 1661 feast there provoked Louis XIV, who then commissioned Versailles."],
["H","Sigiriya's water, boulder and terraced gardens belong to:",["5th c. AD Sri Lanka, King Kasyapa","3rd c. BC India, Ashoka","11th c. AD Java, Sailendra","1st c. AD Egypt, Ptolemaic"],"Sigiriya is among the oldest surviving landscaped gardens in Asia."],
["H","The 'Harvard Revolt' of the late 1930s involved:",["Kiley, Eckbo and Rose","Church, Halprin and Burle Marx","Jellicoe, Tunnard and Crowe","Olmsted, Vaux and Downing"],"Dan Kiley, Garrett Eckbo and James Rose rebelled against the Beaux-Arts curriculum."],
["H","Parc de la Villette (Tschumi) is organised through layers of:",["Points, lines and surfaces","Axes, terraces and canals","Rooms, corridors and courts","Nodes, edges and districts"],"The red folies form the points layer, over lines and surfaces."],
["H","The Lodhi Garden in Delhi (1968) is linked to:",["Joseph Stein and Garrett Eckbo","Edwin Lutyens and William Mustoe","Le Corbusier and Nek Chand","Geoffrey Bawa and Charles Correa"],"Stein and Eckbo; Lutyens and Mustoe are linked to the Rashtrapati Bhavan Mughal Gardens."],
["H","Red Books with before-and-after flaps were the tool of:",["Humphry Repton","Capability Brown","William Kent","Gertrude Jekyll"],"Repton presented proposals in Red Books and coined 'landscape gardener'."],
["H","'Paradise' derives from the Old Persian pairidaeza, meaning:",["A walled enclosure","A water channel","A shaded pavilion","A fruit orchard"],"The word passed via Greek paradeisos; the enclosure protected the garden from desert wind."],
["P","Which is NOT one of Kevin Lynch's five elements of the city image?",["Corridors","Edges","Nodes","Landmarks"],"The five are paths, edges, districts, nodes and landmarks."],
["P","On a contour map, a ridge is shown by contour bends that point:",["Downhill (to lower ground)","Uphill (to higher ground)","Across the slope","Toward the nearest stream"],"Ridge contours bulge toward lower elevation; valley contours point uphill."],
["P","Maximum gradient normally cited for an accessible ramp in India:",["1:12","1:10","1:15","1:20"],"1:12 with landings; 1:20 is the limit for a walk without ramp treatment."],
["P","In the Rational Method Q = CiA/360, area A is taken in:",["Hectares","Square metres","Square kilometres","Acres"],"Q in m3/s, i in mm/h and A in hectares."],
["P","The neighbourhood unit concept (1929) is credited to:",["Clarence Perry","Ebenezer Howard","Stein and Wright","Patrick Geddes"],"Perry proposed it; Stein and Wright applied related ideas at Radburn the same year."],
["P","Radburn introduced which planning feature?",["Superblocks with pedestrian and vehicle separation","A greenbelt around a self-contained town","Linear city along a transit spine","High-rise towers within parkland"],"Stein and Wright's Radburn used superblocks and cul-de-sacs."],
["P","The outdoor step proportion rule is:",["2R + T = 600-650 mm","R + T = 300 mm","R x T = 45,000 mm2","2T + R = 600 mm"],"Twice the riser plus the tread, commonly 600-650 mm."],
["P","A windbreak gives best protection on the leeward side to about:",["10 times its height","2 times its height","30 times its height on average","Its own height"],"Optimal porosity is roughly 40-50 per cent."],
["P","An ecotone is best described as:",["A transition zone between two ecosystems","A corridor linking habitat patches","A protected buffer around a reserve","A climax community"],"Ecotones are species-rich because of the edge effect."],
["P","Coarse-textured foliage placed in the foreground makes a space appear:",["Smaller and closer","Longer and deeper","Cooler and quieter","Unchanged"],"Coarse texture advances; fine texture recedes."],
["P","'Landscape ecology' as a term was coined by:",["Carl Troll, 1939","Ian McHarg, 1969","Richard Forman, 1986","Patrick Geddes, 1915"],"Forman and Godron later developed the patch-corridor-matrix model."],
["P","The overlay method of suitability mapping was popularised by:",["Ian McHarg","Kevin Lynch","Lawrence Halprin","Jan Gehl"],"McHarg's Design with Nature (1969) used transparent map overlays."],
["P","Typical area allowance per car (ECS) in open parking in many Indian bye-laws:",["About 23 m2","About 12 m2","About 32 m2","About 40 m2"],"Roughly 23 open, 28 stilt or multilevel, 32 basement; local codes vary."],
["P","A comfortable enclosure ratio D/H for a plaza is about:",["2 to 3","0.5","5 to 6","1 or less"],"D/H of 1 is strong enclosure; beyond about 4 it weakens."],
["P","Kevin Lynch's book 'Site Planning' appeared in:",["1962","1960","1969","1971"],"The Image of the City was 1960; Design with Nature was 1969."],
["E","Which paving pattern best distributes vehicular loads in interlocking pavers?",["Herringbone","Stack bond","Basketweave","Running bond"],"Herringbone locks units in several directions."],
["E","The most water-efficient irrigation method is:",["Drip","Sprinkler","Flood","Hand hose"],"Drip is about 85-95 per cent efficient."],
["E","Which grass is best for shaded lawns?",["Axonopus compressus","Cynodon dactylon","Zoysia japonica","Pennisetum clandestinum"],"Carpet grass tolerates shade; Cynodon suits full sun and sports."],
["E","A columnar tree suited to tight spaces is:",["Polyalthia longifolia","Samanea saman","Ficus benghalensis","Delonix regia"],"Rain tree, banyan and gulmohar are broad-crowned."],
["E","An extensive green roof typically has a substrate depth of:",["50-150 mm","Above 300 mm","500-900 mm","Under 20 mm"],"Intensive roofs are deeper than 150 mm and heavier."],
["E","Weep holes with granular backfill in a retaining wall mainly:",["Relieve water pressure behind the wall","Reduce material cost","Allow plants to root through","Increase wall height"],"Water pressure is a leading cause of retaining wall failure."],
["E","Recommended mulch depth around plants:",["50-75 mm, clear of the trunk","150-200 mm against the trunk","10-20 mm","Over 300 mm"],"Mulch conserves moisture and suppresses weeds."],
["E","A typical avenue tree pit is:",["1 m x 1 m x 1 m","0.3 m cube","2 m x 2 m x 0.5 m","0.5 m x 0.5 m x 2 m"],"Small shrub pits are about 300-450 mm."],
["E","Compared with a retention pond, a detention basin:",["Holds runoff temporarily and releases it","Keeps a permanent pool","Only infiltrates water","Only treats wastewater"],"Detention cuts peak flow; retention keeps a permanent pool."],
["E","The first stage of the EIA process is:",["Screening","Scoping","Public hearing","Appraisal"],"Order: screening, scoping, baseline and prediction, hearing, EMP, appraisal, clearance."],
["E","The mitigation hierarchy in order is:",["Avoid, minimise, restore, offset","Minimise, avoid, offset, restore","Restore, avoid, minimise, offset","Offset, restore, minimise, avoid"],"Avoidance comes first; offsets are the last resort."],
["E","A nitrogen-fixing landscape tree is:",["Pongamia pinnata","Azadirachta indica","Mangifera indica","Tectona grandis"],"Pongamia is a legume; neem, mango and teak are not."],
["E","NBC 2016 Part 10 deals with:",["Landscape planning, design and development","Fire and life safety","Plumbing services","Structural design"],"Part 10 covers landscape and signage/outdoor display structures."],
["E","Tactile paving that warns of a hazard has which pattern?",["Blister or dot","Long parallel bars","Diagonal grooves","Smooth polished"],"Bars guide direction; blisters warn at crossings and stair edges."],
["E","For a point source of noise, level falls by about how much per doubling of distance?",["6 dB","3 dB","10 dB","1 dB"],"A line source such as a road falls about 3 dB."],
["E","The Miyawaki method plants native saplings at roughly:",["3 per m2","1 per 10 m2","10 per m2","1 per m2 in a single row"],"It builds dense multi-layer native forest quickly."]
];
const $=id=>document.getElementById(id),K="ar001";
let S={a:{},ord:Q.map((_,i)=>i),o:{},t:"all",f:"all",i:0,d:matchMedia("(prefers-color-scheme:dark)").matches};
try{Object.assign(S,JSON.parse(localStorage.getItem(K)||"{}"))}catch(e){}
if(S.ord.length!=Q.length)S.ord=Q.map((_,i)=>i);
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function opts(id){if(!S.o[id])S.o[id]=shuf([0,1,2,3]);return S.o[id]}
function list(){return S.ord.filter(id=>(S.t=="all"||Q[id][0]==S.t)&&(S.f=="all"||(S.f=="un"?S.a[id]===undefined:S.f=="ok"?S.a[id]===0:(S.a[id]!==undefined&&S.a[id]!==0))))}
function render(){
 document.documentElement.dataset.t=S.d?"dark":"light";$("th").textContent=S.d?"Light":"Dark";
 const L=list();if(S.i>=L.length)S.i=Math.max(0,L.length-1);
 const ans=Object.keys(S.a).length,ok=Object.values(S.a).filter(v=>v===0).length;
 $("pr").textContent="Answered "+ans+" of "+Q.length;$("sc").textContent="Score "+ok+" / "+ans;$("pb").style.width=(ans/Q.length*100)+"%";
 const A=$("app");
 if(!L.length){A.innerHTML='<div class="card em">No questions match this filter.</div>';return}
 const id=L[S.i],q=Q[id],done=S.a[id]!==undefined;
 A.innerHTML='<div class="card"><div class="tp">'+T[q[0]]+' · Question '+(S.i+1)+' of '+L.length+'</div><p class="q"></p><div id="os"></div><div id="ex"></div></div>';
 A.querySelector(".q").textContent=q[1];
 opts(id).forEach(k=>{const b=document.createElement("button");b.className="o";b.textContent=q[2][k];
  if(done){b.disabled=true;if(k===0)b.classList.add("ok");else if(k===S.a[id])b.classList.add("no")}
  b.onclick=()=>{if(S.a[id]===undefined){S.a[id]=k;save();render()}};$("os").appendChild(b)});
 if(done){const e=$("ex");e.className="ex";e.textContent=(S.a[id]===0?"Correct. ":"Not quite. ")+q[3]}
}
$("tp").innerHTML='<option value="all">All topics</option>'+Object.keys(T).map(k=>'<option value="'+k+'">'+T[k]+'</option>').join("");
$("tp").value=S.t;$("fl").value=S.f;
$("tp").onchange=e=>{S.t=e.target.value;S.i=0;save();render()};
$("fl").onchange=e=>{S.f=e.target.value;S.i=0;save();render()};
$("sh").onclick=()=>{S.ord=shuf(S.ord);S.o={};S.i=0;save();render()};
$("rs").onclick=()=>{if(confirm("Clear all answers and progress?")){S.a={};S.o={};S.i=0;save();render()}};
$("th").onclick=()=>{S.d=!S.d;save();render()};
$("pv").onclick=()=>{if(S.i>0){S.i--;save();render()}};
$("nx").onclick=()=>{if(S.i<list().length-1){S.i++;save();render()}};
render();
</script></body></html>
